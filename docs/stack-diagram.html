<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>svg2lottie-cli — Architecture &amp; Stack Diagram</title>
  <style>
    :root {
      --bg: #f1f5f9;
      --panel: #ffffff;
      --text: #0f172a;
      --sub: #475569;
      --border: #cbd5e1;
      --accent: #264f74;
    }
    body.dark {
      --bg: #0b1120;
      --panel: #1e293b;
      --text: #f8fafc;
      --sub: #94a3b8;
      --border: #334155;
      --accent: #38bdf8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px;
      transition: background 0.2s, color 0.2s;
    }
    .toolbar {
      width: 100%;
      max-width: 1160px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      gap: 12px;
      flex-wrap: wrap;
    }
    .toolbar h1 {
      font-size: 18px;
      font-weight: 700;
    }
    .toolbar p {
      font-size: 13px;
      color: var(--sub);
    }
    .actions {
      display: flex;
      gap: 8px;
    }
    button {
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover {
      border-color: var(--accent);
    }
    button:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    .diagram-frame {
      width: 100%;
      max-width: 1160px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      overflow-x: auto;
    }
    body.dark .diagram-frame img {
      filter: invert(0.92) hue-rotate(180deg);
    }
    .diagram-frame img {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 10px;
    }
  </style>
</head>
<body>
  <header class="toolbar">
    <div>
      <h1>svg2lottie-cli — Architecture &amp; Stack Diagram</h1>
      <p>Inspired by caru-ini/stack-diagram • Universal SVG-to-Lottie CLI &amp; Inspection Studio</p>
    </div>
    <div class="actions">
      <button type="button" id="theme-toggle" aria-label="テーマ切替 (Light / Dark)">🌙 Dark / Light 切替</button>
    </div>
  </header>
  <main class="diagram-frame">
    <img src="./stack-diagram.svg" alt="svg2lottie-cli システム構成図（パッケージランナー、入力素材、Node.jsゼロ依存エンジン、モジュラーエフェクト、検収＆AI修正指示スタジオ）" />
  </main>
  <script>
    const btn = document.getElementById('theme-toggle');
    btn.addEventListener('click', () => {
      document.body.classList.toggle('dark');
    });
  </script>
</body>
</html>
