<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>svg2lottie-cli — エフェクト機能は準備中です</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --sub: #64748b;
      --border: #e2e8f0;
      --accent: #0284c7;
    }
    body {
      margin: 0;
      padding: 40px 20px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 80vh;
    }
    .notice-card {
      max-width: 620px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 40px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
      text-align: center;
    }
    h1 {
      margin: 0 0 16px;
      font-size: 24px;
    }
    p {
      margin: 0 0 24px;
      color: var(--sub);
      line-height: 1.7;
    }
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--accent);
      color: #fff;
      padding: 12px 24px;
      border-radius: 9999px;
      text-decoration: none;
      font-weight: 600;
      transition: opacity 0.2s;
    }
    .back-btn:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <div class="notice-card">
    <div style="font-size: 48px; margin-bottom: 16px;">🧪</div>
    <h1>エフェクト・ショールームは現在準備中です</h1>
    <p>
      エフェクト機能群（炎、水、ガラス、クラック、ポップイン等）は現在実験的フェーズにあり、商業アニメーション・プロ品質の水準を満たすべく再設計を行っているため、ショールームは一時的に非表示としています。<br/>
      アニメーションの検収およびAI修正指示の作成は、メインのオンライン検収スタジオをご利用ください。
    </p>
    <a href="./index.html" class="back-btn">🔍 オンライン検収スタジオへ戻る</a>
  </div>
</body>
</html>
